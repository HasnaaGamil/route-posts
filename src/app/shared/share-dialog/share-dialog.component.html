<div class="fixed inset-0 z-50 grid place-items-center bg-slate-900/40 p-4" (click)="close()">
  <div class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-3xl bg-white p-6 shadow-xl" role="dialog" aria-modal="true"
       aria-label="Share post" (click)="$event.stopPropagation()">

    <div class="flex items-center justify-between">
      <h3 class="text-xl font-bold">Share post</h3>
      <button type="button" (click)="close()" aria-label="Close" [disabled]="busy()"
              class="grid h-9 w-9 place-items-center rounded-full text-slate-500 hover:bg-slate-100 disabled:opacity-50">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>

    <div class="mt-4 flex items-center gap-3">
      <app-avatar [src]="auth.user()?.photo" [name]="auth.user()?.name ?? ''" size="h-10 w-10" />
      <p class="font-bold">{{ auth.user()?.name }}</p>
    </div>

    <textarea [value]="caption()" (input)="onInput($event)" [disabled]="busy()" rows="3" dir="auto"
              placeholder="Say something about this post… (optional)"
              class="mt-3 w-full resize-y rounded-2xl border border-slate-200 bg-slate-50 p-4 text-base
                     placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20"></textarea>

    <!-- Preview of the post being shared -->
    <div class="mt-3 rounded-2xl border border-slate-200 p-4">
      <div class="flex items-center gap-3">
        <app-avatar [src]="post().user.photo" [name]="post().user.name" size="h-9 w-9" />
        <div class="min-w-0">
          <p class="truncate text-sm font-bold leading-tight">{{ post().user.name.trim() }}</p>
          <p class="truncate text-xs text-slate-500">&#64;{{ post().user.username }} · {{ post().createdAt | timeAgo }}</p>
        </div>
      </div>
      @if (post().body) {
        <p dir="auto" class="mt-2 line-clamp-3 whitespace-pre-line break-words text-sm text-slate-800">{{ post().body }}</p>
      }
      @if (post().image) {
        <img [src]="post().image" alt="Post image" class="mt-2 max-h-40 w-full rounded-xl object-cover" />
      }
    </div>

    @if (errorMsg()) {
      <p class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ errorMsg() }}</p>
    }

    <div class="mt-5 flex justify-end gap-2">
      <button type="button" (click)="close()" [disabled]="busy()"
              class="rounded-xl px-5 py-2.5 font-semibold text-slate-700 hover:bg-slate-100 disabled:opacity-60">Cancel</button>
      <button type="button" (click)="submit()" [disabled]="busy()"
              class="rounded-xl bg-blue-600 px-6 py-2.5 font-bold text-white hover:bg-blue-700 disabled:opacity-60">
        {{ busy() ? 'Sharing…' : 'Share now' }}
      </button>
    </div>
  </div>
</div>
