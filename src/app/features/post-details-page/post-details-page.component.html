<div class="space-y-5">

  <a routerLink="/feed" class="inline-flex items-center gap-2 font-semibold text-slate-600 hover:text-blue-600">
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
    Back to feed
  </a>

  @if (loading()) {
    <div class="animate-pulse rounded-3xl border border-slate-200/70 bg-white p-5 shadow-sm" aria-busy="true">
      <div class="flex items-center gap-3">
        <div class="h-12 w-12 rounded-full bg-slate-200"></div>
        <div class="flex-1 space-y-2">
          <div class="h-3 w-1/3 rounded bg-slate-200"></div>
          <div class="h-3 w-1/4 rounded bg-slate-100"></div>
        </div>
      </div>
      <div class="mt-5 space-y-2">
        <div class="h-3 w-full rounded bg-slate-100"></div>
        <div class="h-3 w-5/6 rounded bg-slate-100"></div>
        <div class="h-3 w-2/3 rounded bg-slate-100"></div>
      </div>
    </div>
  } @else if (error()) {
    <div class="rounded-3xl border border-slate-200/70 bg-white px-6 py-14 text-center shadow-sm" role="alert">
      <p class="font-semibold text-slate-700">{{ error() }}</p>
      @if (!notFound()) {
        <button type="button" (click)="retry()" class="mt-3 font-bold text-blue-600 hover:underline">Try again</button>
      }
    </div>
  } @else if (post(); as p) {
    <app-post-card [post]="p" [inlineComments]="false" (deleted)="onDeleted()" (updated)="post.set($event)" />

    <app-comments-section [postId]="p._id" />

    <!-- TODO: comment box once the "add comment" endpoint is connected -->
  }
</div>
