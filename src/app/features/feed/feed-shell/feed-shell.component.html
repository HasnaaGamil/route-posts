<!-- Phones and tablets (< lg): the left menu becomes a sticky, swipeable pill bar -->
<nav class="sticky top-[73px] z-20 border-b border-slate-200/70 bg-white/90 backdrop-blur lg:hidden" aria-label="Main">
  <div class="mx-auto max-w-screen-2xl overflow-x-auto px-4 [scrollbar-width:none] sm:px-6 [&::-webkit-scrollbar]:hidden">
    <ul class="flex gap-2 py-2.5 text-sm font-semibold text-slate-700">
      <li>
        <a routerLink="/feed" routerLinkActive="bg-blue-50 text-blue-600" ariaCurrentWhenActive="page"
           class="flex shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-4 py-2">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="14" height="16" rx="2" /><path d="M8 9h6M8 13h6M18 8h2v10a2 2 0 01-2 2" /></svg>
          Feed
        </a>
      </li>
      <li>
        <a routerLink="/my-posts" routerLinkActive="bg-blue-50 text-blue-600" ariaCurrentWhenActive="page"
           class="flex shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-4 py-2">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3zM19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z" /></svg>
          My Posts
        </a>
      </li>
      <li>
        <a routerLink="/community" routerLinkActive="bg-blue-50 text-blue-600" ariaCurrentWhenActive="page"
           class="flex shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-4 py-2">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" /></svg>
          Community
        </a>
      </li>
      <li>
        <a routerLink="/saved" routerLinkActive="bg-blue-50 text-blue-600" ariaCurrentWhenActive="page"
           class="flex shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-4 py-2">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4V4z" /></svg>
          Saved
        </a>
      </li>
    </ul>
  </div>
</nav>

<div class="mx-auto grid max-w-screen-2xl grid-cols-1 items-start gap-4 px-4 py-4 sm:gap-5 sm:px-6 sm:py-5
            lg:grid-cols-[240px_minmax(0,1fr)] lg:px-10
            xl:grid-cols-[260px_minmax(0,1fr)_320px] 2xl:grid-cols-[280px_minmax(0,1fr)_340px]">

  <!-- Left sidebar (lg and up) -->
  <aside class="sticky top-[92px] hidden rounded-3xl border border-slate-200/70 bg-white p-3 shadow-sm lg:block">
    <nav class="space-y-1 font-semibold text-slate-700" aria-label="Main">
      <a routerLink="/feed" routerLinkActive="bg-blue-50 text-blue-600"
         class="flex items-center gap-3 rounded-xl px-4 py-3">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="14" height="16" rx="2" /><path d="M8 9h6M8 13h6M18 8h2v10a2 2 0 01-2 2" /></svg>
        Feed
      </a>
      <a routerLink="/my-posts" routerLinkActive="bg-blue-50 text-blue-600"
         class="flex items-center gap-3 rounded-xl px-4 py-3">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3zM19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z" /></svg>
        My Posts
      </a>
      <a routerLink="/community" routerLinkActive="bg-blue-50 text-blue-600"
         class="flex items-center gap-3 rounded-xl px-4 py-3">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" /></svg>
        Community
      </a>
      <a routerLink="/saved" routerLinkActive="bg-blue-50 text-blue-600"
         class="flex items-center gap-3 rounded-xl px-4 py-3">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4V4z" /></svg>
        Saved
      </a>
    </nav>
  </aside>

  <!-- Center: the child route renders here -->
  <section class="min-w-0">

    <!-- Below xl there is no right sidebar, so suggestions get a collapsible panel (closed by default) -->
    @if (!isXl()) {
      <div class="mb-4 rounded-3xl border border-slate-200/70 bg-white shadow-sm sm:mb-5">
        <button type="button" (click)="friendsOpen.set(!friendsOpen())" [attr.aria-expanded]="friendsOpen()"
                aria-controls="suggested-panel"
                class="flex w-full items-center justify-between gap-3 px-4 py-3.5 text-left font-bold sm:px-5">
          <span class="flex items-center gap-2">
            <svg class="h-5 w-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M16 4.5a3.5 3.5 0 010 7M18 14.5c2.2.6 4 2.4 4 5.5" /></svg>
            Suggested friends
          </span>
          <svg class="h-5 w-5 text-slate-500 transition-transform" [class.rotate-180]="friendsOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>

        <!-- Only created once opened, so closed panels don't load anything -->
        @if (friendsOpen()) {
          <div id="suggested-panel" class="border-t border-slate-100 p-4 sm:p-5">
            <app-suggested-friends layout="grid" [showHeader]="false" />
          </div>
        }
      </div>
    }

    <router-outlet />
  </section>

  <!-- Right sidebar (xl and up) -->
  @if (isXl()) {
    <aside class="sticky top-[92px] max-h-[calc(100vh-110px)] overflow-y-auto overscroll-contain rounded-3xl border border-slate-200/70 bg-white p-4 shadow-sm">
      <app-suggested-friends />
    </aside>
  }
</div>
