<div class="space-y-5">
  @if (loading()) {
    @for (i of [1, 2]; track i) {
      <div class="animate-pulse rounded-3xl border border-slate-200/70 bg-white p-5 shadow-sm" aria-busy="true">
        <div class="flex items-center gap-3">
          <div class="h-12 w-12 rounded-full bg-slate-200"></div>
          <div class="flex-1 space-y-2">
            <div class="h-3 w-1/3 rounded bg-slate-200"></div>
            <div class="h-3 w-1/4 rounded bg-slate-100"></div>
          </div>
        </div>
        <div class="mt-5 space-y-2">
          <div class="h-3 w-full rounded bg-slate-100"></div>
          <div class="h-3 w-5/6 rounded bg-slate-100"></div>
        </div>
      </div>
    }
  } @else if (error() && !posts().length) {
    <div class="rounded-3xl bg-red-50 px-6 py-10 text-center text-red-700 shadow-sm" role="alert">
      {{ error() }}
      <button type="button" (click)="loadFirstPage()" class="mt-3 block w-full font-bold underline">Try again</button>
    </div>
  } @else if (!posts().length) {
    <div class="rounded-3xl border border-slate-200/70 bg-white px-6 py-14 text-center text-slate-500 shadow-sm">
      {{ emptyText() }}
    </div>
  } @else {
    @for (post of posts(); track post._id) {
      <app-post-card [post]="post" (deleted)="remove($event)" (updated)="replace($event)" (postShared)="prepend($event)" />
    }

    @if (error()) {
      <p class="text-center text-sm text-red-600" role="alert">{{ error() }}</p>
    }

    @if (nextPage()) {
      <button type="button" (click)="loadMore()" [disabled]="loadingMore()"
              class="w-full rounded-2xl border border-slate-200 bg-white py-3 font-bold text-blue-600 shadow-sm
                     hover:bg-blue-50 disabled:opacity-60">
        {{ loadingMore() ? 'Loading…' : 'Load more' }}
      </button>
    }
  }
</div>
