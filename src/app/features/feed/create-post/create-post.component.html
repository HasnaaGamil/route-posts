<div class="relative overflow-hidden rounded-3xl border border-slate-200/70 bg-white p-5 shadow-sm">

  <!-- Publishing progress bar -->
  @if (posting()) {
    <div class="absolute inset-x-0 top-0 h-1 bg-blue-100" role="progressbar" aria-label="Publishing your post"
         [attr.aria-valuenow]="progress()" aria-valuemin="0" aria-valuemax="100">
      <div class="h-full bg-blue-600 transition-all duration-300"
           [class.animate-pulse]="progress() === 0 || progress() === 100"
           [style.width.%]="progress() || 20"></div>
    </div>
  }

  <div class="flex items-start gap-3">
    <app-avatar [src]="auth.user()?.photo" [name]="auth.user()?.name ?? ''" size="h-12 w-12" />

    <div>
      <p class="text-lg font-bold leading-tight">{{ auth.user()?.name }}</p>

      <!-- Privacy -->
      <label class="relative mt-1 inline-flex items-center gap-2 rounded-full bg-slate-100 py-1.5 pl-3 pr-8 text-sm font-medium text-slate-700">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" /></svg>
        <select [value]="privacy()" (change)="onPrivacy($event)" [disabled]="posting()" aria-label="Post visibility"
                class="appearance-none bg-transparent pr-1 focus:outline-none">
          @for (o of privacyOptions; track o.value) {
            <option [value]="o.value" [selected]="o.value === privacy()">{{ o.label }}</option>
          }
        </select>
        <svg class="pointer-events-none absolute right-2.5 h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
      </label>
    </div>
  </div>

  <textarea [value]="content()" (input)="onInput($event)" [disabled]="posting()" rows="5"
            [placeholder]="'What\'s on your mind, ' + firstName() + '?'" dir="auto"
            class="mt-4 w-full resize-y rounded-2xl border border-slate-200 bg-slate-50 p-4 text-lg text-slate-800
                   placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20"></textarea>

  <!-- Image preview -->
  @if (previewUrl(); as url) {
    <div class="relative mt-3">
      <img [src]="url" alt="Selected image preview" class="max-h-80 w-full rounded-2xl object-cover" />
      <button type="button" (click)="clearImage()" aria-label="Remove image"
              class="absolute right-2 top-2 grid h-8 w-8 place-items-center rounded-full bg-slate-900/70 text-white hover:bg-slate-900">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
  }

  @if (errorMsg()) {
    <p class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ errorMsg() }}</p>
  }

  @if (justPosted()) {
    <p class="mt-3 flex items-center gap-2 rounded-lg bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700" role="status">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7" /></svg>
      Your post is live.
    </p>
  }

  <hr class="my-4 border-slate-300" />

  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 text-slate-700 sm:gap-4">
      <!-- Hidden file input, opened by the Photo/video button -->
      <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFile($event)" />
      <button type="button" (click)="fileInput.click()" [disabled]="posting()" class="flex items-center gap-2 rounded-xl px-3 py-2 hover:bg-slate-50 disabled:opacity-50">
        <svg class="h-5 w-5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="1.5" /><path d="M21 16l-5-5-9 9" /></svg>
        <span class="hidden sm:inline">Photo/video</span>
      </button>
      <button type="button" class="flex items-center gap-2 rounded-xl px-3 py-2 hover:bg-slate-50">
        <svg class="h-5 w-5 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01" /></svg>
        <span class="hidden sm:inline">Feeling/activity</span>
      </button>
    </div>

    <button type="button" (click)="submit()" [disabled]="!canPost()"
            class="flex items-center gap-2 rounded-xl bg-blue-600 px-6 py-2.5 font-bold text-white transition
                   hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:hover:bg-blue-300">
      {{ posting() ? 'Publishing…' : 'Post' }}
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z" /></svg>
    </button>
  </div>
</div>
